name: Deploy

on:
  push:
    branches: [main, dev]

concurrency:
  group: deploy-${{ github.ref }}
  # Cancel stuck rebuild-loop deploys when a new push lands on the same branch.
  cancel-in-progress: true

env:
  CI: true
  STAGE: ${{ github.ref == 'refs/heads/main' && 'prod' || 'preview' }}
  # Nuxt + Nitro cloudflare builds peak above Node's ~4GB default heap.
  NODE_OPTIONS: --max-old-space-size=8192
  # Actions themselves (checkout/setup-node) still ship Node-20 entrypoints;
  # this only silences the runner warning — the job Node is set below to 22.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Verify Node version
        run: |
          node -v
          major="$(node -p "process.versions.node.split('.')[0]")"
          test "$major" = "22"
      - name: Cache Nuxt SEO (skew protection)
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/nuxt-seo
          key: nuxt-skew-${{ github.sha }}
          restore-keys: |
            nuxt-skew-
      - run: pnpm install --frozen-lockfile
      - name: Deploy
        run: |
          set -euo pipefail
          if [ "${STAGE}" = "prod" ]; then
            if [ -z "${PROD_WEB_HOST:-}" ]; then
              echo "PROD_WEB_HOST secret is required for prod deploys" >&2
              exit 1
            fi
            # Nuxt bakes site.url at build time from process.env — Alchemy Worker
            # bindings alone are not enough if nuxt.config defaults to localhost.
            host="${PROD_WEB_HOST#https://}"
            host="${host#http://}"
            host="${host%/}"
            export NUXT_PUBLIC_SITE_URL="https://${host}"
            export NUXT_SITE_ENV=production
            export NUXT_SITE_INDEXABLE=true
            echo "Prod site URL: ${NUXT_PUBLIC_SITE_URL}"
          fi
          pnpm alchemy deploy --stage "${STAGE}" --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NUXT_SESSION_PASSWORD: ${{ secrets.NUXT_SESSION_PASSWORD }}
          NUXT_OG_IMAGE_SECRET: ${{ secrets.NUXT_OG_IMAGE_SECRET }}
          STRAPI_URL: ${{ secrets.STRAPI_URL }}
          STRAPI_API_TOKEN: ${{ secrets.STRAPI_API_TOKEN }}
          PROD_WEB_HOST: ${{ secrets.PROD_WEB_HOST }}
          PROD_CMS_HOST: ${{ secrets.PROD_CMS_HOST }}
          NUXT_UMAMI_ID: ${{ secrets.NUXT_UMAMI_ID }}
          NUXT_UMAMI_HOST: ${{ secrets.NUXT_UMAMI_HOST }}
          GITHUB_SHA: ${{ github.sha }}
          # Never enable skew KV bundling in CI (wrangler-per-asset + converge risk)
          SKEW_BUNDLE_ASSETS: '0'
